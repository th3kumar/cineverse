name: Deploy (Vercel)

# Production deploy on every push to main, preview deploy for every PR.
# Inactive until these repo secrets exist: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# (If you'd rather use Vercel's own GitHub integration, delete this file.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Check Vercel secrets
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Vercel secrets not set — skipping deploy. See README › Deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Build and deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npm i -g vercel@latest
          PROD=$([ "$TARGET" = production ] && echo --prod || true)
          vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          vercel build $PROD --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
